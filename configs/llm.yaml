# Hồ sơ chạy LLM theo phần cứng. Chọn bằng biến môi trường DATAMATE_LLM_PROFILE hoặc tham số --profile.
# Tham số lấy theo SPEC §7. Đổi giá trị ở đây (hoặc ghi đè bằng --tp/--dtype/... của các công cụ), không sửa code.
# `scripts/env_report.py` đề xuất hồ sơ phù hợp với máy đang chạy.
default_profile: rtx5090x2

profiles:
  # Máy chấm của BTC: 2x RTX 5090 (32 GB/card), CUDA >= 12.8, bf16. Model ~9-10B: một card.
  rtx5090x2:
    backend: vllm
    dtype: bfloat16
    tensor_parallel_size: 1
    max_model_len: 16384
    gpu_memory_utilization: 0.85
    enable_prefix_caching: true
    enforce_eager: false
    quantization: null

  # Như trên nhưng model ~14B bf16 (~30 GB) phải chia cho 2 card.
  rtx5090x2_tp2:
    backend: vllm
    dtype: bfloat16
    tensor_parallel_size: 2
    max_model_len: 16384
    gpu_memory_utilization: 0.85
    enable_prefix_caching: true
    enforce_eager: false
    quantization: null

  # Một GPU lớn bất kỳ có bf16 (A100/H100/L40S/RTX 6000...), >= 40 GB: model 14B bf16 nằm trọn một card.
  gpu_bf16:
    backend: vllm
    dtype: bfloat16
    tensor_parallel_size: 1
    max_model_len: 16384
    gpu_memory_utilization: 0.90
    enable_prefix_caching: true
    enforce_eager: false
    quantization: null

  # GPU không có bf16 (T4, V100, P100...). Số học khác máy chấm: chỉ để gỡ lỗi / so sánh tương đối.
  gpu_fp16:
    backend: vllm
    dtype: float16
    tensor_parallel_size: 1
    max_model_len: 8192
    gpu_memory_utilization: 0.90
    enable_prefix_caching: true
    enforce_eager: true
    quantization: null

  # Dự phòng khi vLLM không chạy được trên máy đó: Transformers, không giải mã ràng buộc, chậm.
  hf_fallback:
    backend: hf
    dtype: bfloat16
    tensor_parallel_size: 1
    max_model_len: 8192
    gpu_memory_utilization: 0.90
    enable_prefix_caching: false
    enforce_eager: true
    quantization: null
