[project]
name = "datamate"
version = "0.1.0"
description = "DataMate agent for Zalo AI Challenge 2026"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# Xử lý dữ liệu và executor (ghim phiên bản cụ thể trong uv.lock)
data = [
    "pandas>=2.2",
    "pyarrow>=16",
    "python-calamine>=0.2",
    "openpyxl>=3.1",
    "charset-normalizer>=3.3",
    "python-dateutil>=2.9",
    "duckdb>=1.0",
    "rapidfuzz>=3.9",
    "bm25s>=0.2",
    "pydantic>=2.7",
    "orjson>=3.10",
    "pyyaml>=6.0",
    "scikit-learn>=1.5",
]
# Inference LLM — cài trên máy GPU; phiên bản phải hỗ trợ model đã chọn và CUDA >= 12.8 (Blackwell)
llm = [
    "vllm",
    "transformers",
    "safetensors",
    "huggingface_hub",  # chỉ scripts/fetch_model.py (tải model lúc phát triển) dùng; code runtime không import
]
# Fine-tune (chỉ máy dev)
train = [
    "peft",
    "trl",
    "accelerate",
    "bitsandbytes",
    "datasets",
]
dev = [
    "pytest>=8",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["datamate"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
